[project]
name = "quiver"
version = "0.1.0"
description = "Tool selection service for AI agents: picks relevant MCP tools from a large catalog"
readme = "README.md"
authors = [
    { name = "Maksim Brett", email = "maxim.brett.ru@gmail.com" }
]
requires-python = ">=3.12.3"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
quiver = "quiver:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
